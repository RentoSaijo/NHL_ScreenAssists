project:
  type: manuscript
  output-dir: _output

manuscript:
  article: paper.qmd
  meca-bundle: false

execute:
  echo: false
  warning: false
  message: false
  freeze: false

format:
  html:
    toc: true
    number-sections: true
    embed-resources: true
    code-tools: false
    lightbox: false
    notebook-links: false
    notebook-view: false
    include-in-header:
      text: |
        <style>
        mjx-container[display="true"] {
          max-width: 100%;
          overflow-x: auto;
          overflow-y: hidden;
          padding-block: 0.25rem;
        }
        #refs a { overflow-wrap: anywhere; }
        </style>
    other-links:
      - text: Rankings and replay explorer
        href: https://RentoSaijo.github.io/NHL_ScreenAssists/
      - text: GitHub repository
        href: https://github.com/RentoSaijo/NHL_ScreenAssists
  jasa-pdf:
    keep-tex: false
    notebook-links: false
    shift-heading-level-by: 0
    fig-pos: H
    colorlinks: true
    linkcolor: black
    citecolor: black
    urlcolor: blue
    include-in-header:
      text: |
        \usepackage{float}
        \usepackage{microtype}
        \usepackage{longtable}
        \clubpenalty=10000
        \widowpenalty=10000
        \AtBeginDocument{\renewcommand{\harvardurl}[1]{\url{#1}}}

bibliography: references.bib
